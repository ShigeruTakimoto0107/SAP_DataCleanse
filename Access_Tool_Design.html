
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: A4; margin: 15mm; background-color: #f4f7f6; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; margin: 0; padding: 0; }
        h1 { color: #004a99; border-bottom: 2px solid #004a99; padding-bottom: 10px; }
        .dashboard-container { display: block; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .layout-grid { display: table; width: 100%; }
        .sidebar { display: table-cell; width: 250px; background: #004a99; color: #fff; padding: 20px; border-radius: 5px; vertical-align: top; }
        .main-panel { display: table-cell; padding-left: 20px; vertical-align: top; }
        .panel-box { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        h2 { color: #004a99; font-size: 1.2em; }
        .btn { display: inline-block; padding: 10px 15px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; margin: 5px 0; font-size: 0.9em; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>SAPデータクレンジングツール - 画面構成案</h1>
    <div class="dashboard-container">
        <div class="layout-grid">
            <div class="sidebar">
                <h2>Control Panel</h2>
                <p>1. インポート</p>
                <p>2. クエリ管理</p>
                <p>3. エクスポート</p>
            </div>
            <div class="main-panel">
                <div class="panel-box">
                    <h2>データ/クエリ一覧</h2>
                    <table>
                        <thead><tr><th>種別</th><th>名称</th><th>最終更新</th></tr></thead>
                        <tbody>
                            <tr><td>テーブル</td><td>Master_Material_001</td><td>2026-08-09</td></tr>
                            <tr><td>クエリ</td><td>Clean_Transaction_Data</td><td>2026-08-09</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
